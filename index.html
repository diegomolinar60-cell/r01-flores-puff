<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop 01 Flores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: el modelo ocupa toda la pantalla; ficha arriba a la izquierda y barra de vistas abajo, flotando sobre el lienzo. */
:root{
  --bg:#E4E3DF; --ink:#1C2130; --muted:#5D6170; --panel:rgba(246,245,241,.86); --line:rgba(28,33,48,.14);
  --navy:#2A354D; --cream:#E6DDD0; --on-navy:#F4EFE6;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171A21;--ink:#ECE8E1;--muted:#A3A6B0;--panel:rgba(30,34,44,.86);--line:rgba(236,232,225,.16);--navy:#8EA0C8;--on-navy:#121520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171A21;--ink:#ECE8E1;--muted:#A3A6B0;--panel:rgba(30,34,44,.86);--line:rgba(236,232,225,.16);--navy:#8EA0C8;--on-navy:#121520;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.card{pointer-events:auto;align-self:flex-start;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;max-width:min(340px,100%)}
.eyebrow{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 26px/1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.specs{display:grid;gap:6px;margin:0}
.specs div{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center}
.specs dt{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:0;min-width:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px var(--line)}
code{font:12px var(--mono)}
.bar{pointer-events:auto;align-self:center;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px;max-width:100%}
.bar .sep{width:1px;background:var(--line);margin:4px 2px}
button{font:600 13px var(--body);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
button:hover{background:var(--line)}
button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.hint{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
#status{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font:12px var(--mono);color:var(--muted);letter-spacing:.06em}
@media (max-width:560px){h1{font-size:20px}.card{padding:10px 12px;gap:4px}.specs,.hint{display:none}button{padding:7px 10px;font-size:12px}.bar .sep{display:none}}
.mini{display:none;font-size:12px;color:var(--muted)}
@media (max-width:560px){.mini{display:block}}
/* Editor de color */
.edit{border-top:1px solid var(--line);padding-top:8px}
.edit summary{cursor:pointer;font:600 13px var(--body);list-style:none;display:flex;justify-content:space-between;align-items:center}
.edit summary::-webkit-details-marker{display:none}
.edit summary::after{content:"+";font:400 18px var(--mono);color:var(--muted)}
.edit[open] summary::after{content:"–"}
.edit summary:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:4px}
.zone{display:grid;gap:6px;margin-top:10px}
.zone-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zone-head b{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.zone-head span{font-size:12px;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{width:24px;height:24px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{transform:scale(1.1);background-clip:padding-box}
.chip[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.wheel{position:relative;width:24px;height:24px;border-radius:50%;overflow:hidden;
  background:conic-gradient(#e44,#ee4,#4e4,#4ee,#44e,#e4e,#e44);box-shadow:inset 0 0 0 1px var(--line)}
.wheel input{position:absolute;inset:-6px;width:36px;height:36px;opacity:0;cursor:pointer}
.models{display:flex;flex-wrap:wrap;gap:6px}
.models button{border:1px solid var(--line);padding:6px 12px;font-size:12px}
.models button[aria-pressed="true"]{border-color:transparent}
.models b{font:11px var(--mono);letter-spacing:.06em;margin-right:6px;opacity:.75;font-weight:400}
.reset{justify-self:start;font-size:12px;padding:6px 10px;margin-top:4px;border:1px solid var(--line)}
.edit-body{max-height:min(52vh,420px);overflow:auto;padding-right:2px}
@media (max-width:560px){.card{max-width:100%}.chip,.wheel{width:22px;height:22px}.edit-body{max-height:34vh}}
</style>

</head><body>
<div id="stage" aria-label="Modelo 3D de la sudadera. Arrastra para girar, pellizca o usa la rueda para acercar."></div>
<div id="status">Cargando modelo… 0%</div>
<div class="ui">
  <section class="card">
    <span class="eyebrow">Puebla · Drop 01 · Bocetos aprobados</span>
    <nav class="models" id="models" aria-label="Modelos"></nav>
    <h1 id="titulo">R01 Flores Puff</h1>
    <dl class="specs">
      <div><dt>Espalda</dt><dd id="spec-esp"></dd></div>
      <div><dt>Frente</dt><dd id="spec-fr"></dd></div>
      <div><dt>Tela</dt><dd id="spec-tela"></dd></div>
      <div><dt>Puff espalda</dt><dd id="spec-puff"></dd></div>
      <div><dt>Bordado frente</dt><dd id="spec-bordado"></dd></div>
    </dl>
    <details class="edit" id="editor">
      <summary>Editar colores</summary>
      <div class="edit-body">
        <div class="zone" data-zone="tela"><div class="zone-head"><b>Tela</b><span></span></div><div class="chips"></div></div>
        <div class="zone" data-zone="puff"><div class="zone-head"><b>Estampado espalda</b><span></span></div><div class="chips"></div></div>
        <div class="zone" data-zone="bordado"><div class="zone-head"><b>Flor bordada</b><span></span></div><div class="chips"></div></div>
        <button class="reset" id="reset" type="button">Volver a los colores originales</button>
      </div>
    </details>
    <span class="mini" id="mini">Puff atrás, bordado al frente</span>
    <span class="hint">Arrastra para girar · rueda o pellizco para acercar · clic derecho para mover</span>
  </section>
  <nav class="bar" aria-label="Vistas">
    <button id="v-frente" data-v="frente" aria-pressed="false">Frente</button>
    <button id="v-espalda" data-v="espalda" aria-pressed="false">Espalda</button>
    <button id="v-34" data-v="tres-cuartos" aria-pressed="true">3/4</button>
    <button id="v-perfil" data-v="perfil" aria-pressed="false">Perfil</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="v-puff" data-v="puff" aria-pressed="false">Detalle puff</button>
    <button id="v-bordado" data-v="bordado" aria-pressed="false">Detalle bordado</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="v-giro" aria-pressed="false">Girar</button>
  </nav>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage'), status = document.getElementById('status');
// Modelos del visor. Para agregar uno: su modelo web (.json), su máscara de zonas (R = estampado, G = bordado) y sus acercamientos.
const MODELS = [
  { id: '1', nombre: 'Modelo 1', titulo: 'R01 Flores Puff', archivo: 'modelos/m1.json', mascara: 'modelos/m1-mascara.png',
    espalda: 'Dos flores en puff print', frente: 'Parche bordado acolchado',
    puff: [0.01, 0.23, -0.15, 0.62, 180], bordado: [0, 0.448, 0.12, 0.36, 0] },
  { id: '2', nombre: 'Modelo 2', titulo: 'R02 Flor Rosa', archivo: 'modelos/m2.json', mascara: 'modelos/m2-mascara.png',
    espalda: 'Flor gigante en puff print', frente: 'Parche bordado con rosa',
    puff: [0.015, 0.33, -0.16, 0.9, 180], bordado: [0.163, 0.145, 0.126, 0.36, 14] },
];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const bgColor = () => new THREE.Color(getComputedStyle(document.body).backgroundColor);
scene.background = bgColor();
new MutationObserver(() => { scene.background = bgColor(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { scene.background = bgColor(); });

const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 0.25; controls.maxDistance = 4.5; controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8f8a84, 1.7));
const key = new THREE.DirectionalLight(0xffffff, 2.3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: 0.1, far: 10 }); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.002;
const rim = new THREE.DirectionalLight(0xffffff, 1.2);
camera.add(key, rim); key.position.set(-1.4, 1.5, 0.6); key.target.position.set(0, 0, -2.5); camera.add(key.target); rim.position.set(0.6, 0.9, -5);
scene.add(camera);

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- Colores aprobados (tus 4 láminas + negro, blanco, gris, azul y verde). El primero es el original ----------
const TELA = [['Azul medianoche', '#2A354D'], ['Negro', '#111111'], ['Gris', '#8C8D91'], ['Azul', '#1F3A93'], ['Verde', '#2E5E3A'], ['Petróleo', '#2D535C'], ['Café arcilla', '#875C2D'], ['Terracota', '#9B6256'], ['Ciruela', '#564854'], ['Salvia', '#A6BBB9'], ['Rosa polvo', '#E3B3A9'], ['Lila gris', '#C4BFCD'], ['Hueso', '#F4E9D3']];
const TINTA = [['Crema', '#E6DDD0'], ['Blanco', '#FFFFFF'], ['Negro', '#111111'], ['Hueso', '#F4E9D3'], ['Crema durazno', '#F3E2CD'], ['Miel', '#E3BE6F'], ['Mostaza', '#DA9832'], ['Coral', '#DC886C'], ['Rosa', '#DF808A'], ['Rosa polvo', '#E3B3A9'], ['Aqua', '#8DC6CE'], ['Menta', '#D2F3EE'], ['Índigo', '#443F8E'], ['Azul medianoche', '#2A354D']];
const LISTS = { tela: TELA, puff: TINTA, bordado: TINTA };
const ORIG = { tela: '#2A354D', puff: '#E6DDD0', bordado: '#E6DDD0' };
const lum = (hex) => { const c = new THREE.Color(hex); return 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b; };
const nameOf = (zone, hex) => (LISTS[zone].find(([, h]) => h.toLowerCase() === hex.toLowerCase()) || ['Personalizado'])[0];
const specHTML = (hex, zone) => `<i class="sw" style="background:${hex}"></i>${nameOf(zone, hex)} <code>${hex.toUpperCase()}</code>`;

// ---------- Carga de modelos (se cargan al elegirlos y se guardan) ----------
const cache = {};
async function loadModel(m) {
  if (cache[m.id]) return cache[m.id];
  status.hidden = false; status.textContent = `Cargando ${m.nombre}…`;
  const embedded = document.getElementById('modelo-' + m.id);
  const gltf = embedded ? await new GLTFLoader().parseAsync(embedded.textContent, '')
    : await new GLTFLoader().loadAsync(m.archivo, (e) => { if (e.total) status.textContent = `Cargando ${m.nombre}… ${Math.round((e.loaded / e.total) * 100)}%`; });
  const root = gltf.scene;
  // La máscara se espera antes de mostrar el modelo: sin ella el parche y el estampado se pintarían como tela.
  const mask = await new THREE.TextureLoader().loadAsync((window.MASCARAS || {})[m.id] || m.mascara); mask.colorSpace = THREE.NoColorSpace;
  const U = {
    uMask: { value: mask }, uTela: { value: new THREE.Color(ORIG.tela) }, uPuff: { value: new THREE.Color(ORIG.puff) }, uBord: { value: new THREE.Color(ORIG.bordado) },
    uLTela: { value: lum(ORIG.tela) }, uLTinta: { value: lum(ORIG.puff) },
  };
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.computeVertexNormals(); o.castShadow = o.receiveShadow = true; o.material.side = THREE.DoubleSide;
    o.material.onBeforeCompile = (sh) => {
      Object.assign(sh.uniforms, U);
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform sampler2D uMask; uniform vec3 uTela, uPuff, uBord; uniform float uLTela, uLTinta;')
        .replace('#include <map_fragment>', `#include <map_fragment>
          vec4 mk = texture2D(uMask, vMapUv);
          float L = dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722));
          vec3 cTela = uTela * (L / uLTela), cPuff = uPuff * (L / uLTinta), cBord = uBord * (L / uLTinta);
          diffuseColor.rgb = mix(mix(cTela, cPuff, mk.r), cBord, mk.g);`);
    };
    o.material.needsUpdate = true;
  });
  cache[m.id] = { root, U, colors: { ...ORIG } };
  status.hidden = true;
  return cache[m.id];
}

// ---------- Editor de color (actúa sobre el modelo visible; cada modelo guarda sus colores) ----------
let active = null, activeModel = null;
function setColor(zone, hex) {
  if (!active) return;
  active.colors[zone] = hex;
  ({ tela: active.U.uTela, puff: active.U.uPuff, bordado: active.U.uBord })[zone].value.set(hex);
  document.getElementById('spec-' + zone).innerHTML = specHTML(hex, zone);
  const z = document.querySelector(`.zone[data-zone="${zone}"]`);
  z.querySelector('.zone-head span').innerHTML = specHTML(hex, zone);
  z.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.hex.toLowerCase() === hex.toLowerCase())));
  z.querySelector('input[type=color]').value = hex.length === 7 ? hex : '#000000';
  const c = active.colors;
  document.getElementById('mini').textContent = `${activeModel.nombre} · tela ${nameOf('tela', c.tela)} · puff ${nameOf('puff', c.puff)} · bordado ${nameOf('bordado', c.bordado)}`;
}
for (const zone of Object.keys(LISTS)) {
  const box = document.querySelector(`.zone[data-zone="${zone}"] .chips`);
  for (const [name, hex] of LISTS[zone]) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.hex = hex;
    b.style.background = hex; b.title = `${name} ${hex}`; b.setAttribute('aria-label', `${name} ${hex}`);
    b.addEventListener('click', () => setColor(zone, hex)); box.appendChild(b);
  }
  const w = document.createElement('label'); w.className = 'wheel'; w.title = 'Elegir cualquier color';
  w.innerHTML = `<input type="color" id="libre-${zone}" aria-label="Elegir cualquier color para ${zone}">`;
  w.querySelector('input').addEventListener('input', (e) => setColor(zone, e.target.value));
  box.appendChild(w);
}
document.getElementById('reset').addEventListener('click', () => { for (const z of Object.keys(ORIG)) setColor(z, ORIG[z]); });

// ---------- Vistas (metros; el modelo mira a +Z; resorte inferior en y = 0) ----------
let VIEWS = {};
function buildViews(root, m) {
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2), hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const narrow = camera.aspect < 0.9;
  const fit = Math.max((size.y * 0.5) / Math.tan(vHalf) * 1.55, (Math.max(size.x, size.z) * 0.5) / Math.tan(hHalf) * (narrow ? 1.08 : 1.2));
  if (narrow) c.y += size.y * 0.12; // en teléfono deja espacio a la barra de abajo
  const around = (deg, d = fit, t = c, dy = 0.06) => { const a = THREE.MathUtils.degToRad(deg); return { pos: new THREE.Vector3(t.x + Math.sin(a) * d, t.y + dy, t.z + Math.cos(a) * d), target: t.clone() }; };
  const det = ([x, y, z, d, deg], dy) => around(deg, d, new THREE.Vector3(x, y, z), dy);
  VIEWS = { frente: around(0), espalda: around(180), 'tres-cuartos': around(35), perfil: around(90), puff: det(m.puff, 0.02), bordado: det(m.bordado, 0.01) };
}

let anim = null;
function go(name, instant) {
  const v = VIEWS[name]; if (!v) return;
  document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === name)));
  if (reduce || instant) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
  anim = { t: 0, p0: camera.position.clone(), q0: controls.target.clone(), p1: v.pos, q1: v.target };
}
document.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => go(b.dataset.v)));
const spin = document.getElementById('v-giro');
spin.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spin.setAttribute('aria-pressed', String(controls.autoRotate)); });
controls.addEventListener('start', () => { anim = null; document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', 'false')); });

// ---------- Selector de modelos (#modelo-2 en el link abre directo ese modelo) ----------
const nav = document.getElementById('models');
for (const m of MODELS) {
  const b = document.createElement('button'); b.type = 'button'; b.id = 'm-' + m.id; b.dataset.m = m.id;
  b.innerHTML = `<b>${m.nombre}</b>${m.titulo.replace(/^R\d+\s*/, '')}`;
  b.addEventListener('click', () => show(m.id)); nav.appendChild(b);
}
let first = true;
async function show(id) {
  const m = MODELS.find((x) => x.id === id) || MODELS[0];
  nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.m === m.id)));
  const e = await loadModel(m);
  if (active) scene.remove(active.root);
  active = e; activeModel = m; scene.add(e.root);
  document.getElementById('titulo').textContent = m.titulo; document.title = `${m.titulo} · Drop 01`;
  document.getElementById('spec-esp').textContent = m.espalda; document.getElementById('spec-fr').textContent = m.frente;
  for (const z of Object.keys(ORIG)) setColor(z, e.colors[z]);
  buildViews(e.root, m);
  if (first) { go('tres-cuartos', true); first = false; }
  try { history.replaceState(null, '', '#modelo-' + m.id); } catch {}
}
window.__visor = { scene, camera, controls, cache }; // para diagnóstico desde la consola
const fromHash = (location.hash.match(/^#modelo-(\w+)$/) || [])[1];
await show(fromHash || MODELS[0].id);
addEventListener('hashchange', () => { const h = (location.hash.match(/^#modelo-(\w+)$/) || [])[1]; if (h && h !== activeModel.id) show(h); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (anim) {
    anim.t = Math.min(1, anim.t + dt / 0.9); const k = 1 - Math.pow(1 - anim.t, 3);
    camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.q0, anim.q1, k);
    if (anim.t >= 1) anim = null;
  }
  controls.update(); renderer.render(scene, camera);
});
</script>

</body></html>
